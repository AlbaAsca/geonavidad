<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>GeoNavidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen app. Map fills the stage; a control rail sits right (master) or a bar below (leader). Night-sky map, pine land, candle-gold accent. Single dark look by choice (it is shown on a shared screen). */
:root{
  --night:#0e2a1c; --sea:#173a5c; --land:#eef4f2; --land-hi:#ffffff; --border:#9db7c4;
  --panel:#123524; --line:#d4a63a55; --ink:#fff8ec; --muted:#b9d3c2;
  --gold:#f4c04e; --gold-ink:#2a1504; --red:#d42b38; --ok:#8fe0a6;
  --xmas:"Mountains of Christmas", Georgia, serif;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#1b4a32 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--display);font-size:15px;overflow:hidden}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
header{position:relative;padding-bottom:14px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--ink) 10px 20px)}
.holly{width:34px;height:28px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--xmas);font-weight:700;font-size:34px;line-height:1;display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 #00000055}
.brand i{font-style:normal;color:var(--red);text-shadow:0 0 1px var(--ink),0 2px 0 #00000055}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.spacer{flex:1}
.stage{flex:1;min-height:0;display:flex;gap:12px}
.mapwrap{position:relative;flex:1;min-width:0;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.land{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.land:hover{fill:var(--land-hi)}
.grat{fill:none;stroke:#ffffff14;stroke-width:1;vector-effect:non-scaling-stroke}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.country{position:absolute;left:10px;bottom:10px;background:#0d1b26cc;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted);pointer-events:none}
.country:empty{display:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.gold{background:var(--red);color:#fff;border-color:var(--gold);box-shadow:inset 0 -3px 0 #00000033}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input.t,select.t,textarea.t{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;letter-spacing:0;text-transform:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;border:2px solid var(--gold);font-weight:700;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;z-index:20}
/* Leader */
.lbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.lbar .code{flex:1;min-width:0}
.lbar .code input{width:100%}
.hint{color:var(--muted);font-size:13px}
/* Master */
.rail{width:340px;flex:none;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 3px 0 var(--red)}
.card h3{margin:0;font-family:var(--xmas);font-size:22px;color:var(--gold);font-weight:700;letter-spacing:0}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rounds button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--night);font-weight:800;font-size:16px}
.rounds button.on{background:var(--red);color:#fff;border-color:var(--gold)}
.rounds button.done{border-color:var(--ok)}
.timer{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;text-align:center;letter-spacing:-.02em}
.timer.low{color:var(--red)}
.timer.over{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.timer.over{animation:none}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.roundbig{position:absolute;left:12px;top:10px;background:#123524e6;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800;font-size:20px}
.roundbig small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.reveal{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--red);color:#fff;border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:800;font-size:20px;max-width:70%;text-align:center}
.final{position:absolute;inset:0;display:grid;place-items:center;background:#0e2a1ccc;padding:16px;z-index:3}
.fbox{background:var(--panel);border:2px solid var(--gold);border-radius:18px;padding:18px 22px;min-width:min(420px,100%);max-width:100%;box-shadow:inset 0 5px 0 var(--red)}
.ftitle{font-family:var(--xmas);font-size:40px;color:var(--gold);text-align:center;margin-bottom:10px}
.frow{display:grid;grid-template-columns:40px 16px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700}
.frow.win{font-size:24px;color:var(--gold)}
.fpos{text-align:center}
.fteam{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.cfg summary{cursor:pointer;font-weight:700}
.cfgrow{display:grid;grid-template-columns:22px 1fr 78px 78px;gap:6px;align-items:center}
.cfgrow input{min-width:0;padding:6px 7px;font-size:13px}
.warn{color:var(--gold);font-size:12px}
.lbl{font:700 13px var(--display);fill:#5a0d15;paint-order:stroke;stroke:#fff;stroke-width:4px}
@media (max-width:820px){
  body{overflow:auto}
  .stage{flex-direction:column}
  .mapwrap{min-height:55vh}
  .rail{width:auto;overflow:visible}
}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>

const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_PLACES = [1,2,3,4,5,6].map(n=>({name:"Lugar "+n,lat:0,lng:0}));
const $ = s => document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function haversine(a,b){const R=6371,r=Math.PI/180;const dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function score(km){if(km<0.2)return 5000;return Math.round(5000*Math.exp(-km/2000))}
function fmtKm(km){return km<1?Math.round(km*1000)+' m':km<100?km.toFixed(1)+' km':Math.round(km).toLocaleString('es-ES')+' km'}
const PALETTE=['#f2b84b','#e2574c','#6fcf8f','#7fb6ff','#d48cff','#ff9f6b','#4fd6d0','#ffd8e5','#c3e86b','#b9a3ff','#ff6fae','#9fe0ff'];

let countries=[];

function makeMap(container,{onPick}={}){
  const W=1000,H=620;
  const svg=d3.select(container).insert('svg',':first-child').attr('viewBox',`0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
  const proj=d3.geoMercator().fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[-168,-56],[179.9,76],[-168,76],[179.9,-56]]});
  const path=d3.geoPath(proj);
  const g=svg.append('g');
  g.append('path').attr('class','grat').attr('d',path(d3.geoGraticule10()));
  const nameBox=d3.select(container).append('div').attr('class','country');
  g.selectAll('path.land').data(countries).join('path').attr('class','land').attr('d',path)
    .on('pointerenter',(e,d)=>nameBox.text(d.properties.name)).on('pointerleave',()=>nameBox.text(''));
  const over=svg.append('g');
  let t=d3.zoomIdentity;
  const zoom=d3.zoom().scaleExtent([1,400]).clickDistance(5).translateExtent([[-200,-200],[W+200,H+200]])
    .on('zoom',e=>{t=e.transform;g.attr('transform',t);draw()});
  svg.call(zoom).on('dblclick.zoom',null);
  const z=d3.select(container).append('div').attr('class','zoombtns');
  z.append('button').attr('aria-label','Acercar').text('+').on('click',()=>svg.transition().duration(250).call(zoom.scaleBy,2));
  z.append('button').attr('aria-label','Alejar').text('−').on('click',()=>svg.transition().duration(250).call(zoom.scaleBy,.5));
  z.append('button').attr('aria-label','Ver mundo').text('⌂').style('font-size','16px').on('click',()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity));
  svg.on('click',e=>{if(!onPick)return;const p=t.invert(d3.pointer(e,svg.node()));const ll=proj.invert(p);if(!ll)return;
    const hit=countries.find(c=>d3.geoContains(c,ll));nameBox.text(hit?hit.properties.name:'Océano');
    onPick({lng:((ll[0]+540)%360)-180,lat:ll[1]})});
  let items={markers:[],lines:[]};
  function P(ll){const p=proj([ll.lng,ll.lat]);return t.apply(p)}
  function draw(){
    over.selectAll('*').remove();
    for(const l of items.lines){const a=P(l.a),b=P(l.b);over.append('line').attr('x1',a[0]).attr('y1',a[1]).attr('x2',b[0]).attr('y2',b[1]).attr('stroke',l.color).attr('stroke-width',2).attr('stroke-dasharray','6 5').attr('opacity',.9)}
    for(const m of items.markers){const p=P(m);
      if(m.star){over.append('path').attr('d',d3.symbol(d3.symbolStar,520)()).attr('transform',`translate(${p})`).attr('fill','#f2b84b').attr('stroke','#1d1405').attr('stroke-width',2)}
      else{const c=m.color||'#f2b84b';const gp=over.append('g').attr('transform',`translate(${p})`);
        gp.append('ellipse').attr('rx',6).attr('ry',2.5).attr('fill','#00000066');
        gp.append('path').attr('d','M0,0 C-4,-10 -15,-15 -15,-28 A15,15 0 1 1 15,-28 C15,-15 4,-10 0,0Z').attr('fill',c).attr('stroke','#0d1b26').attr('stroke-width',2);
        gp.append('rect').attr('x',-8).attr('y',-31).attr('width',16).attr('height',11).attr('rx',1.5).attr('fill','#fff8ec');
        gp.append('rect').attr('x',-9.5).attr('y',-35).attr('width',19).attr('height',5).attr('rx',1.5).attr('fill','#fff8ec').attr('stroke','#0d1b26').attr('stroke-width',.6);
        gp.append('rect').attr('x',-1.6).attr('y',-35).attr('width',3.2).attr('height',15).attr('fill','#e2574c');
        gp.append('path').attr('d','M0,-35 C-7,-43 -9,-36 0,-35 C9,-36 7,-43 0,-35Z').attr('fill','#e2574c').attr('stroke','#0d1b26').attr('stroke-width',.6)}
      if(m.label)over.append('text').attr('class','lbl').attr('x',p[0]+(m.star?14:18)).attr('y',p[1]+(m.star?4:-24)).text(m.label)}
  }
  return {
    set(next){items=next;draw()},
    fit(pts){if(!pts.length)return;const xy=pts.map(p=>proj([p.lng,p.lat]));const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]);
      let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const pad=60;
      const k=Math.max(1,Math.min(60,.85/Math.max((x1-x0+pad)/W,(y1-y0+pad)/H)));
      const cx=(x0+x1)/2,cy=(y0+y1)/2;svg.transition().duration(900).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy))}
  };
}

/* ---------- RED (ntfy.sh) ---------- */
const SALA=(new URLSearchParams(location.search).get('sala')||'navidad-k7q2x9').replace(/[^\w-]/g,'');
const NTFY='https://ntfy.sh/geonavidad-'+SALA;
const Net={
  async send(o){const r=await fetch(NTFY,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw new Error('HTTP '+r.status)},
  async history(){try{const r=await fetch(NTFY+'/json?poll=1&since=all');const t=await r.text();
    return t.split('\n').filter(Boolean).map(l=>{try{const m=JSON.parse(l);return m.event==='message'?Object.assign(JSON.parse(m.message),{_t:m.time}):null}catch(e){return null}}).filter(Boolean)}catch(e){return []}},
  listen(fn,status){try{const es=new EventSource(NTFY+'/sse');es.onopen=()=>status(true);es.onerror=()=>status(false);
    es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==='message')fn(Object.assign(JSON.parse(m.message),{_t:m.time}))}catch(_){}}}catch(e){status(false)}}
};
function netDot(ok){const d=$('#net');if(!d)return;d.textContent=ok?'Conectado':'Sin conexión';d.style.color=ok?'var(--ok)':'var(--red)'}

/* ---------- LEADER VIEW ---------- */
function leader(){
  const st=LS.get('geo-leader',{team:''});
  let state={gid:null,r:0,endAt:0,open:false,revealed:false,answer:null,total:6};
  let pick=null,sentFor=null;
  $('#app').innerHTML=`
  <header>
    <div class="brand">Geo<i>Navidad</i></div><span class="tag" id="net">Conectando…</span><div class="spacer"></div>
    <label class="f">Equipo<input class="t" id="team" maxlength="24" placeholder="Nombre del equipo" value="${esc(st.team)}"></label>
  </header>
  <div class="stage"><div class="mapwrap" id="map"><div class="roundbig" id="rbig"><small>Ronda</small>–</div><div class="reveal" id="rev" hidden></div><div class="final" id="final" hidden></div></div></div>
  <div class="lbar">
    <div class="timer mono" id="ltimer" style="font-size:34px;min-width:96px">–:––</div>
    <div class="hint code" id="status">Esperando a que el master empiece la ronda.</div>
    <button class="btn gold" id="send" disabled>Enviar respuesta</button>
  </div>
  <details class="hint"><summary>¿No se envía? Copia el texto y pégalo en el chat de Meet</summary>
    <div class="lbar" style="margin-top:6px"><input class="t mono code" id="code" readonly><button class="btn" id="copy">Copiar</button></div></details>`;
  const map=makeMap($('#map'),{onPick(ll){if(state.revealed)return;pick=ll;sentFor=null;drawMine();update()}});
  const team=$('#team'),send=$('#send'),code=$('#code');
  function drawMine(){const mk=[];const ln=[];
    if(state.revealed&&state.answer){const res=state.results||[];
      for(const x of res){mk.push({lat:x.lat,lng:x.lng,color:x.color,label:x.team});ln.push({a:x,b:state.answer,color:x.color})}
      if(pick&&!res.some(x=>x.team===team.value.trim()))mk.push({...pick,color:'#d42b38',label:'Tú'});
      mk.push({...state.answer,star:true,label:state.answer.name})}
    else if(pick)mk.push({...pick,color:'#d42b38',label:team.value.trim()||'Tú'});
    map.set({markers:mk,lines:ln})}
  function timeLeft(){return state.open&&state.endAt?Math.max(0,Math.ceil((state.endAt-Date.now())/1000)):null}
  function update(){const tn=team.value.replace(/[|\n]/g,' ').trim();LS.set('geo-leader',{team:tn});
    const tl=timeLeft();const canSend=!!(pick&&tn&&state.open&&tl>0);send.disabled=!canSend;
    const el=$('#ltimer');el.textContent=tl===null?'–:––':Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0');el.className='timer mono'+(tl!==null&&tl<=10?' low':'');
    $('#rbig').innerHTML=`<small>Ronda</small>${state.r?state.r+' / '+state.total:'–'}`;
    const s=$('#status');
    if(state.final)s.textContent='Partida terminada. ¡Gracias por jugar!';
    else if(state.revealed&&state.answer){const mine=(state.results||[]).find(x=>x.team===tn);s.innerHTML=mine?`Estabais a <b>${fmtKm(mine.km)}</b> · ${mine.pts} puntos`:pick?`Estabais a <b>${fmtKm(haversine(pick,state.answer))}</b> · ${score(haversine(pick,state.answer))} puntos`:'Ronda resuelta.'}
    else if(!tn)s.textContent='Escribe arriba el nombre del equipo.';
    else if(state.phase==='paused')s.textContent='Pausa.';else if(!state.open)s.textContent=state.r?'Ronda cerrada. Espera a la siguiente.':'Esperando a que el master empiece la ronda.';
    else if(tl===0)s.textContent='¡Tiempo!';
    else if(sentFor===state.r)s.innerHTML='<b style="color:var(--ok)">Enviada.</b> Puedes cambiarla hasta que acabe el tiempo.';
    else s.textContent=pick?'Pulsa Enviar respuesta.':'Toca el mapa para colocar tu regalo.';
    code.value=pick&&tn&&state.r?`GEO R${state.r} | ${tn} | ${pick.lat.toFixed(5)}, ${pick.lng.toFixed(5)}`:''}
  team.addEventListener('input',update);
  send.addEventListener('click',async()=>{const tn=team.value.replace(/[|\n]/g,' ').trim();send.disabled=true;
    try{await Net.send({k:'guess',gid:state.gid,r:state.r,team:tn,lat:pick.lat,lng:pick.lng});sentFor=state.r;toast('¡Regalo enviado!')}
    catch(e){toast('No se pudo enviar. Usa la opción de copiar y pégalo en el chat.')}update()});
  $('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.value);toast('Copiado. Pégalo en el chat de Meet.')}catch(e){code.select()}});
  function apply(m){if(m.k!=='state')return;const newRound=m.r!==state.r||m.gid!==state.gid;state=m;
    if(newRound){pick=null;sentFor=null}
    $('#rev').hidden=!(m.revealed&&m.answer);if(m.revealed&&m.answer){const res=m.results||[];$('#rev').textContent=m.answer.name+(res.length?` · Gana ${res[0].team}`:'');map.fit([m.answer,...res])}
    $('#final').hidden=!m.final;if(m.final)$('#final').innerHTML=finalHTML(m.final);
    drawMine();update()}
  Net.history().then(h=>{const last=h.filter(m=>m.k==='state').pop();if(last)apply(last)});
  Net.listen(apply,netDot);
  setInterval(update,500);update();
}

/* ---------- MASTER VIEW ---------- */
function master(){
  const S=LS.get('geo-master3',null)||{places:DEFAULT_PLACES,secs:30,revealSecs:15,round:1,guesses:{},revealed:{},closeAt:{}};
  if(!S.gid)S.gid=Math.random().toString(36).slice(2,10);S.closeAt=S.closeAt||{};S.revealSecs=S.revealSecs||15;
  const save=()=>LS.set('geo-master3',S);
  let phase='idle',phaseEnd=0,pausedLeft=0,pausedFrom='',left=S.secs,lastBeep=-1,audio=null;
  $('#app').innerHTML=`
  <header>
    <div class="brand">Geo<i>Navidad</i></div><span class="tag">Master</span><span class="tag" id="net">Conectando…</span><div class="spacer"></div>
    <span class="hint">Enlace para los líderes: <span class="mono" id="llink"></span></span>
  </header>
  <div class="stage">
    <div class="mapwrap" id="map"><div class="roundbig" id="rbig"></div><div class="reveal" id="rev" hidden></div><div class="final" id="final" hidden></div></div>
    <aside class="rail">
      <section class="card"><h3>Ronda</h3><div class="rounds" id="rounds"></div></section>
      <section class="card"><h3>Temporizador</h3>
        <div class="hint" id="tlabel" style="text-align:center">Pulsa Empezar partida</div>
        <div class="timer" id="timer">0:30</div>
        <div class="row"><button class="btn gold" id="tStart">Empezar partida</button><button class="btn" id="tSkip">Saltar</button></div>
      </section>
      <section class="card"><h3>Respuestas · <span id="cnt">0</span></h3><div id="teams"></div></section>
      <section class="card"><h3>Clasificación</h3><div id="board"></div></section>
      <section class="card"><details class="cfg"><summary>Lugares y ajustes</summary>
        <p class="warn">Contiene las soluciones. No lo abras con la pantalla compartida.</p>
        <div id="cfg" style="display:flex;flex-direction:column;gap:6px"></div>
        <div class="row" style="margin-top:8px">
          <label class="f">Segundos por ronda<input class="t mono" id="secs" type="number" min="10" max="600" value="${S.secs}"></label>
          <label class="f">Segundos de resultados<input class="t mono" id="rsecs" type="number" min="5" max="120" value="${S.revealSecs}"></label></div>
        <label class="f" style="margin-top:8px">Respuestas por chat (si alguien no puede enviar)<textarea class="t mono" id="paste" rows="2" placeholder="Pega aquí el chat de Meet"></textarea></label>
        <div class="row" style="margin-top:8px"><button class="btn" id="addPlace">Añadir lugar</button><button class="btn red" id="wipe">Nueva partida</button></div>
        <p class="hint" id="wipeMsg"></p>
      </details></section>
    </aside>
  </div>`;
  const map=makeMap($('#map'));
  function allTeams(){const s=new Set();for(const r in S.guesses)for(const t in S.guesses[r])s.add(t);return [...s].sort((a,b)=>a.localeCompare(b,'es'))}
  function colorOf(name){const i=allTeams().indexOf(name);return PALETTE[(i<0?0:i)%PALETTE.length]}
  function results(r){const pl=S.places[r-1];const g=S.guesses[r]||{};if(!pl)return[];
    return Object.entries(g).map(([team,ll])=>{const km=haversine(pl,ll);return{team,ll,km,pts:score(km)}}).sort((a,b)=>a.km-b.km)}
  function totals(){const tot={};for(const t of allTeams())tot[t]=0;for(const r in S.revealed){if(!S.revealed[r])continue;for(const x of results(+r))tot[x.team]+=x.pts}
    return Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([team,pts])=>({team,pts,color:colorOf(team)}))}
  function renderRounds(){$('#rounds').innerHTML=S.places.map((_,i)=>`<button class="${i+1===S.round?'on':''} ${S.revealed[i+1]?'done':''}" data-r="${i+1}" aria-label="Ronda ${i+1}">${i+1}</button>`).join('');
    $('#rbig').innerHTML=`<small>Ronda</small>${S.round} / ${S.places.length}`}
  function renderTeams(){const r=S.round,rev=S.revealed[r];const g=S.guesses[r]||{};$('#cnt').textContent=Object.keys(g).length;
    if(!rev){$('#teams').innerHTML=Object.keys(g).length?`<table><tr><th>Equipo</th><th class="n">Estado</th></tr>${Object.keys(g).sort().map(t=>`<tr><td><span class="dot" style="background:${colorOf(t)}"></span>${esc(t)}</td><td class="n" style="color:var(--ok)">recibida</td></tr>`).join('')}</table>`:'<p class="hint">Aún no hay respuestas de esta ronda.</p>';return}
    const res=results(r);$('#teams').innerHTML=res.length?`<table><tr><th>Equipo</th><th class="n">Distancia</th><th class="n">Puntos</th></tr>${res.map(x=>`<tr><td><span class="dot" style="background:${colorOf(x.team)}"></span>${esc(x.team)}</td><td class="n">${fmtKm(x.km)}</td><td class="n">${x.pts}</td></tr>`).join('')}</table>`:'<p class="hint">Nadie respondió en esta ronda.</p>'}
  function boardHTML(rows){return rows.length?`<table><tr><th>#</th><th>Equipo</th><th class="n">Total</th></tr>${rows.map((x,i)=>`<tr><td class="mono">${i+1}</td><td><span class="dot" style="background:${x.color}"></span>${esc(x.team)}</td><td class="n">${x.pts.toLocaleString('es-ES')}</td></tr>`).join('')}</table>`:'<p class="hint">Se rellena al revelar cada ronda.</p>'}
  function renderBoard(){$('#board').innerHTML=boardHTML(totals())}
  function renderMap(){const r=S.round,pl=S.places[r-1];
    if(S.revealed[r]&&pl){const res=results(r);
      map.set({lines:res.map(x=>({a:x.ll,b:pl,color:colorOf(x.team)})),markers:[...res.map(x=>({...x.ll,color:colorOf(x.team),label:x.team})),{...pl,star:true,label:pl.name}]});
      $('#rev').textContent=pl.name+(res.length?` · Gana ${res[0].team} (${fmtKm(res[0].km)})`:'');$('#rev').hidden=false;map.fit([pl,...res.map(x=>x.ll)])}
    else{map.set({markers:[],lines:[]});$('#rev').hidden=true}
    $('#final').hidden=phase!=='final';if(phase==='final')$('#final').innerHTML=finalHTML(totals())}
  function renderCfg(){$('#cfg').innerHTML=S.places.map((p,i)=>`<div class="cfgrow"><span class="mono">${i+1}</span><input class="t" id="pn${i}" data-i="${i}" data-k="name" value="${esc(p.name)}" aria-label="Lugar ${i+1}"><input class="t mono" id="pa${i}" data-i="${i}" data-k="lat" value="${p.lat}" aria-label="Latitud ${i+1}"><input class="t mono" id="po${i}" data-i="${i}" data-k="lng" value="${p.lng}" aria-label="Longitud ${i+1}"></div>`).join('')+'<p class="hint">En Google Maps, clic derecho sobre el sitio y pulsa las coordenadas para copiarlas; pégalas en la casilla de latitud.</p>'}
  function all(){renderRounds();renderTeams();renderBoard();renderMap()}
  // ---- red ----
  function publish(){const r=S.round,pl=S.places[r-1],rev=!!S.revealed[r];
    const res=rev?results(r).map(x=>({team:x.team,lat:x.ll.lat,lng:x.ll.lng,km:x.km,pts:x.pts,color:colorOf(x.team)})):null;
    Net.send({k:'state',gid:S.gid,r,total:S.places.length,phase,open:phase==='play',endAt:phase==='play'?phaseEnd:0,revealed:rev,
      answer:rev&&pl?{name:pl.name,lat:pl.lat,lng:pl.lng}:null,results:res,final:phase==='final'?totals():null})
      .catch(()=>toast('No llega la conexión: los líderes pueden pegar la respuesta en el chat.'))}
  function onGuess(m){if(m.k!=='guess'||m.gid!==S.gid)return;const r=+m.r;if(!(r>=1&&r<=S.places.length)||S.revealed[r])return;
    if(S.closeAt[r]&&m._t>S.closeAt[r]+3)return;const lat=+m.lat,lng=+m.lng;if(!(Math.abs(lat)<=90&&Math.abs(lng)<=180))return;
    const team=String(m.team||'').replace(/[|\n]/g,' ').trim().slice(0,24);if(!team)return;(S.guesses[r]=S.guesses[r]||{})[team]={lat,lng};save();all()}
  // ---- motor de la partida ----
  function beep(f,d){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.2,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
  function startRound(){phase='play';phaseEnd=Date.now()+S.secs*1000;lastBeep=-1;delete S.closeAt[S.round];S.revealed[S.round]=false;delete S.guesses[S.round];save();all();publish()}
  function reveal(){phase='reveal';phaseEnd=Date.now()+S.revealSecs*1000;S.revealed[S.round]=true;save();all();publish()}
  function next(){if(S.round<S.places.length){S.round++;startRound()}else{phase='final';save();all();publish();beep(660,.3);setTimeout(()=>beep(880,.5),300)}}
  function loop(){const now=Date.now();
    if(phase==='play'){left=Math.max(0,Math.ceil((phaseEnd-now)/1000));if(left<=5&&left>0&&left!==lastBeep){beep(880,.08);lastBeep=left}
      if(now>=phaseEnd){beep(440,.9);S.closeAt[S.round]=now/1000;phase='grace';phaseEnd=now+2500;save();publish()}}
    else if(phase==='grace'){left=0;if(now>=phaseEnd)reveal()}
    else if(phase==='reveal'){left=Math.max(0,Math.ceil((phaseEnd-now)/1000));if(now>=phaseEnd)next()}
    paint()}
  function paint(){const el=$('#timer'),lb=$('#tlabel'),bt=$('#tStart');const mm=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
    const map={idle:['Pulsa Empezar partida',mm(S.secs),'Empezar partida'],play:['Tiempo para responder',mm(left),'Pausa'],grace:['¡Tiempo!','0:00','Pausa'],
      reveal:['Resultados · siguiente ronda en',mm(left),'Pausa'],paused:['En pausa',mm(Math.ceil(pausedLeft/1000)),'Continuar'],final:['Partida terminada','FIN','Jugar otra vez']};
    const [l,t,b]=map[phase];lb.textContent=l;el.textContent=t;bt.textContent=b;el.className='timer'+(phase==='play'&&left<=5?' low':'')+(phase==='grace'?' over':'')}
  setInterval(loop,250);
  $('#tStart').onclick=()=>{try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    if(phase==='idle')startRound();
    else if(phase==='final'){newGame();startRound()}
    else if(phase==='paused'){phase=pausedFrom;phaseEnd=Date.now()+pausedLeft;publish()}
    else{pausedFrom=phase==='grace'?'grace':phase;pausedLeft=Math.max(0,phaseEnd-Date.now());phase='paused';publish()}
    paint()};
  $('#tSkip').onclick=()=>{if(phase==='play'||phase==='reveal'||phase==='grace')phaseEnd=Date.now();else if(phase==='paused'){pausedLeft=0;phase=pausedFrom;phaseEnd=Date.now()}};
  $('#rounds').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.round=+b.dataset.r;phase='idle';save();all();publish();paint()};
  $('#secs').onchange=e=>{S.secs=Math.max(10,Math.min(600,+e.target.value||30));e.target.value=S.secs;save();paint()};
  $('#rsecs').onchange=e=>{S.revealSecs=Math.max(5,Math.min(120,+e.target.value||15));e.target.value=S.revealSecs;save()};
  const RE=/GEO\s*R(\d+)\s*\|\s*([^|\n]+?)\s*\|\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/g;
  function parse(text){let n=0,m;RE.lastIndex=0;while((m=RE.exec(text))){const r=+m[1],team=m[2].trim().slice(0,24),lat=+m[3],lng=+m[4];
      if(!(r>=1&&r<=S.places.length)||Math.abs(lat)>90||Math.abs(lng)>180||S.revealed[r])continue;(S.guesses[r]=S.guesses[r]||{})[team]={lat,lng};n++}
    save();all();toast(n?`${n} respuesta(s) añadida(s).`:'No he encontrado respuestas con formato GEO R…')}
  $('#paste').addEventListener('paste',e=>{const txt=(e.clipboardData||window.clipboardData).getData('text');if(txt){e.preventDefault();parse(txt)}});
  $('#cfg').addEventListener('change',e=>{const i=+e.target.dataset.i,k=e.target.dataset.k;if(isNaN(i))return;let v=e.target.value.trim();
    if(k==='lat'&&v.includes(',')){const[a,b]=v.split(',').map(s=>+s.trim());if(!isNaN(a)&&!isNaN(b)){S.places[i].lat=a;S.places[i].lng=b}}
    else if(k==='name')S.places[i].name=v;else if(!isNaN(+v))S.places[i][k]=+v;save();renderCfg();all()});
  $('#addPlace').onclick=()=>{if(S.places.length>=10)return;S.places.push({name:'Nuevo lugar',lat:0,lng:0});save();renderCfg();all()};
  function newGame(){S.guesses={};S.revealed={};S.closeAt={};S.round=1;S.gid=Math.random().toString(36).slice(2,10);phase='idle';save();all();publish()}
  let armed=false;$('#wipe').onclick=()=>{if(!armed){armed=true;$('#wipeMsg').textContent='Pulsa otra vez para borrar respuestas y puntos.';$('#wipe').textContent='Confirmar';return}
    armed=false;newGame();$('#wipe').textContent='Nueva partida';$('#wipeMsg').textContent='Partida reiniciada.';paint()};
  renderCfg();all();paint();
  $('#llink').textContent=location.origin+location.pathname+location.search;
  Net.history().then(h=>{h.forEach(onGuess);publish()});Net.listen(onGuess,netDot);
}
function finalHTML(rows){const medal=['🥇','🥈','🥉'];return `<div class="fbox"><div class="ftitle">¡Clasificación final!</div>${rows.length?rows.map((x,i)=>`<div class="frow${i===0?' win':''}"><span class="fpos">${medal[i]||i+1}</span><span class="dot" style="background:${x.color}"></span><span class="fteam">${esc(x.team)}</span><span class="fpts mono">${x.pts.toLocaleString('es-ES')}</span></div>`).join(''):'<p>No hubo respuestas.</p>'}</div>`}

const HOLLY='<svg class="holly" viewBox="0 0 34 28" aria-hidden="true"><path d="M17 15 C12 4 4 6 1 3 C3 8 1 11 3 14 C6 13 9 16 9 19 C12 17 15 18 17 15Z" fill="#2f8a4e" stroke="#0e2a1c"/><path d="M17 15 C22 4 30 6 33 3 C31 8 33 11 31 14 C28 13 25 16 25 19 C22 17 19 18 17 15Z" fill="#2f8a4e" stroke="#0e2a1c"/><circle cx="14" cy="19" r="3.4" fill="#d42b38"/><circle cx="20" cy="19" r="3.4" fill="#d42b38"/><circle cx="17" cy="23.5" r="3.4" fill="#d42b38"/></svg>';
new MutationObserver(()=>{const b=document.querySelector('.brand');if(b&&!b.querySelector('.holly'))b.insertAdjacentHTML('afterbegin',HOLLY)}).observe(document.getElementById('app'),{childList:true});
(function snow(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.getElementById('snow'),x=c.getContext('2d');let W,H,f=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;f=Array.from({length:Math.round(W*H/16000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.25,d:Math.random()*6}))}
  size();addEventListener('resize',size);
  (function loop(t){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';for(const p of f){p.y+=p.s;p.x+=Math.sin(t/1400+p.d)*.3;if(p.y>H){p.y=-4;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}requestAnimationFrame(loop)})(0)})();

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r=>r.json()).then(W=>{countries=topojson.feature(W,W.objects.countries).features;window.addEventListener('hashchange',route);route()}).catch(()=>{document.getElementById('app').innerHTML='<p style="padding:20px">No se pudo cargar el mapa. Recarga la página.</p>'});
